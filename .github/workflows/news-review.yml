name: News review only
# Runs just the automated news review (scripts/review_llm.py), without the full data refresh, then
# rebuilds and commits. The monthly refresh runs the same review; use this to rerun or test it.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Website scan for possibly closed companies (list stays local, not committed)
        continue-on-error: true
        run: python3 scripts/check_closed.py
      - name: Automated news review (Claude, trusted sources only, at most $20)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BUDGET_USD: "20"
        run: |
          pip install --quiet --upgrade anthropic
          python3 scripts/review_llm.py
      - name: Build docs/
        run: python3 scripts/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies data docs
          git diff --cached --quiet || git commit -m "News review ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 10; done
