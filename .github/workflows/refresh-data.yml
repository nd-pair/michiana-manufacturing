name: Refresh public data
# Monthly: pull the public datasets again, import any new facilities, rebuild, and commit.
# Each pull is independent, so one unavailable source does not stop the others; the build
# works without any sidecar file. Run it by hand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "17 6 2 * *"      # 06:17 UTC on the 2nd of every month
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: New facilities from HIFLD (never overwrites existing files)
        continue-on-error: true
        run: python3 scripts/import_hifld.py
      - name: SBIR/STTR awards (SBIR.gov bulk file)
        continue-on-error: true
        run: python3 scripts/pull_sbir.py
      - name: New SBIR/STTR firms in the region (address from their latest award)
        continue-on-error: true
        run: python3 scripts/import_sbir_firms.py
      - name: Fill in coordinates for files that have an address but no lat/lon
        continue-on-error: true
        run: python3 scripts/geocode.py
      - name: Federal contracts and grants (USAspending; stores UEIs as they are found)
        continue-on-error: true
        run: python3 scripts/pull_federal.py
      - name: FDA device establishment registrations (openFDA)
        continue-on-error: true
        run: python3 scripts/pull_fda.py
      - name: Patents (PatentsView; skipped without the PATENTSVIEW_API_KEY secret)
        continue-on-error: true
        env:
          PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
        run: python3 scripts/pull_patents.py
      - name: Timeline events (SBIR awards, federal awards)
        continue-on-error: true
        run: python3 scripts/pull_events.py
      - name: Manufacturing employment, pay and specialization (BLS QCEW)
        continue-on-error: true
        run: python3 scripts/pull_qcew.py
      - name: Occupations, monthly jobs and unemployment (BLS API; BLS_API_KEY optional)
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python3 scripts/pull_bls.py
      - name: Task fit, workforce age and turnover, value added (O*NET, Census QWI, BEA)
        continue-on-error: true
        run: python3 scripts/pull_workforce.py
      - name: Notre Dame physical-AI research awards (USAspending, NSF)
        continue-on-error: true
        run: python3 scripts/pull_nd_research.py
      - name: Build docs/
        run: python3 scripts/build.py
      - name: Commit the refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies data docs
          git diff --cached --quiet || git commit -m "Refresh public data ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 10; done
