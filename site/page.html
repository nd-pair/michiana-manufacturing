<main id="content" class="site-content">
    <div class="page-secondary full-width">
      <section class="section mm-band" aria-label="The map">
      <div class="mm-app" id="mm-app">
        <div class="mm-wrap">
          <div class="mm-grid">
            <div class="mm-panel">
              <div class="mm-ph"><h2>Where they are</h2><span class="mm-count" id="shown"></span></div>
              <div class="mm-scene" id="scene" aria-label="Three-dimensional map of company locations with columns sized by headcount">
                <div class="mm-tip" id="tip"></div>
                <div class="mm-ctl"><button class="mm-iconbtn" id="zin" type="button" aria-label="Zoom in">+</button><button class="mm-iconbtn" id="zout" type="button" aria-label="Zoom out">−</button><button class="mm-iconbtn" id="reset" type="button" aria-label="Reset view">⟲</button><button class="mm-iconbtn" id="campus" type="button" aria-label="Fly to the Notre Dame campus" title="Notre Dame campus">ND</button></div>
                <div class="mm-hud" id="hud"></div>
                <div class="mm-hint">drag · scroll · hover</div>
              </div>
              <div class="mm-legend" id="legend"></div>
              <div class="mm-detail" id="detail"><p class="mm-empty">Select a company on the map or in the roster.</p></div>
            </div>
            <div class="mm-side">
              <div class="mm-panel"><div class="mm-ph"><h2>Sectors</h2><span class="mm-count">click cos or staff to sort</span></div><div class="mm-hist" id="sectors"></div></div>
              <div class="mm-panel"><div class="mm-ph"><h2>Products &amp; services</h2><span class="mm-count" id="tagcount"></span></div>
                <div class="mm-hist"><input class="mm-search" id="tagsearch" type="search" placeholder="Find a product or service, e.g. sheet metal" aria-label="Filter the product list"><div class="mm-tagbox" id="tags"></div></div></div>
            </div>
          </div>
          <div class="mm-panel mm-roster">
            <div class="mm-ph"><h2>Roster</h2><button class="mm-chip" id="clear" type="button">Clear all filters</button></div>
            <table id="table"><thead><tr><th>Company</th><th>Sector</th><th>Employees</th><th>Products &amp; services</th><th>Website</th></tr></thead><tbody></tbody></table>
          </div>
          <p class="mm-foot" id="foot"></p>
        </div>
      </div>
      </section>

    </div>
</main>
