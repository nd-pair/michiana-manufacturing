build_to_print = true
naics = ["334412", "334418"]
patterns = ['\bprinted circuit', '\bpcba?s?\b', '\bcircuit boards?\b', '\belectronic(s)? (assembl|manufactur)', '\bembedded (systems|electronics|computers?|controllers?)\b', '\bmicrocontrollers?\b', '\bintegrated circuits?\b', '\bsemiconductors?\b']
