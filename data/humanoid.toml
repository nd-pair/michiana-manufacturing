# What a full-size humanoid robot is made of, for the humanoid coverage panel.
#
# Each component sits in a body group (the region it shades in the drawing) and carries `cost`, its
# rough share of a humanoid's bill of materials in percent. The shares are editable assumptions,
# set from public teardown estimates, which agree that actuators are about half the cost; they
# should add to 100.
#
# A company counts as a possible local supplier of a component when its NAICS code starts with one
# of `naics`, or when one of `patterns` (regular expressions, matched case-insensitively against its
# name, products and description) and no `exclude` pattern matches near it (within 25 characters),
# unless its NAICS code starts with one of `exclude_naics`. This is an inference.
# Components with `build_to_print = true` are parts a contract manufacturer makes to the robot maker's
# drawings (machined, cast, stamped and molded parts, harnesses, board assembly): any capable local
# shop counts as available for them. Other components count as available only once a company has
# confirmed it makes the part.
# A company file can override the inference:
#   humanoid = ["motors", "reducers"]       # components it supplies (added to the inferred ones)
#   humanoid_not = ["castings"]             # inferred components it does not supply
#   humanoid_evidence = "confirmed"         # or "self-reported"; the default is "inferred"
#   humanoid_note = "Makes frameless BLDC motors up to 200 mm; met 2026-12-03"

[[group]]
id = "perception"
name = "Perception"
region = "Head"

[[group]]
id = "compute"
name = "Compute & electronics"
region = "Chest"

[[group]]
id = "power"
name = "Power"
region = "Abdomen"

[[group]]
id = "actuators"
name = "Actuators"
region = "Joints"

[[group]]
id = "hands"
name = "Hands & touch"
region = "Hands and feet"

[[group]]
id = "structure"
name = "Structure & shell"
region = "Limbs, neck and pelvis"

[[group]]
id = "integration"
name = "Integration & test"
region = "Whole robot"

[[component]]
id = "motors"
group = "actuators"
name = "Electric motors (frameless BLDC, servo)"
cost = 14
naics = ["335312"]
patterns = ['\bmotors?\b', '\bbldc\b', '\bservos?\b', '\bstepper', '\bwindings?\b']
exclude = ['motor ?homes?', 'motor ?coach', 'motorcycles?', 'motor ?sports?', 'motorized', 'motor vehicle', 'motor freight', 'motor mounts?', 'motor starters?']
exclude_naics = ["3361", "3362", "3363"]

[[component]]
id = "reducers"
group = "actuators"
name = "Gear reducers (harmonic, planetary, cycloidal)"
cost = 12
naics = ["333612"]
patterns = ['\bgears?\b', '\bgearbox', '\bgearing\b', '\bspeed reducers?\b', '\bharmonic drive', '\bcycloidal\b', '\bplanetary\b']
exclude = ['landing gear', 'running gear', 'gear ?up', 'camping gear', 'outdoor gear', 'sports? gear', 'power gear']

[[component]]
id = "screws"
group = "actuators"
name = "Roller and ball screws, linear actuators"
cost = 8
naics = []
patterns = ['\bball ?screws?\b', '\broller ?screws?\b', '\blead ?screws?\b', '\blinear actuators?\b', '\bactuators?\b']
exclude = []

[[component]]
id = "bearings"
group = "actuators"
name = "Bearings"
cost = 4
naics = ["332991"]
patterns = ['\bbearings?\b']
exclude = []

[[component]]
id = "encoders"
group = "actuators"
name = "Encoders and joint position sensors"
cost = 3
naics = []
patterns = ['\bencoders?\b', '\bresolvers?\b', '\bposition sensors?\b', '\bhall[- ]effect\b', '\bmagnetic sensors?\b']
exclude = []

[[component]]
id = "drivers"
group = "compute"
name = "Motor drivers and power electronics"
cost = 5
naics = ["335314"]
patterns = ['\bmotor (drives?|controls?|controllers?)\b', '\binverters?\b', '\bpower electronics\b', '\bpower suppl(y|ies)\b', '\bvariable frequency\b', '\bservo drives?\b', '\bpower conversion\b']
exclude = []

[[component]]
id = "computer"
group = "compute"
name = "Main computer (AI processor module)"
cost = 7
naics = []
patterns = ['\bgpus?\b', '\bai (accelerators?|processors?|chips?|modules?)\b', '\bsystem[- ]on[- ](a[- ])?chip\b', '\bsingle[- ]board computers?\b', '\bedge (ai|computers?)\b']
